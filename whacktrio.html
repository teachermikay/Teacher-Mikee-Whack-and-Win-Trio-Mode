<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whack and Win - Teacher Mikee</title>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@700&family=Jua&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-red: #ffadad;
            --pastel-orange: #ffd6a5;
            --pastel-yellow: #fdffb6;
            --pastel-green: #caffbf;
            --pastel-blue: #9bf6ff;
            --pastel-purple: #a0c4ff;
            --pastel-pink: #ffc6ff;
            --text-dark: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' style='font-size:30px'><text y='30'>🔨</text></svg>"), auto;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
            background-color: #f0faff;
        }

        #menu-screen {
            width: 100vw;
            height: 100vh;
            background-color: #f8dff0; 
            background-image: url("menu_bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        #menu-screen.active { display: flex; }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen.active { display: flex; }

        #win-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(240, 250, 255, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        #win-screen.active { display: flex; }

        .main-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: clamp(1.8rem, 6vw, 4rem);
            color: var(--pastel-purple);
            text-shadow: 3px 3px 0px white, -1px -1px 0px white, 1px -1px 0px white, -1px 1px 0px white, 1px 1px 0px white, 4px 4px 10px rgba(0,0,0,0.15);
            margin: 0;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .sub-title {
            font-family: 'Balsamiq Sans', cursive;
            font-weight: 700;
            font-size: clamp(1rem, 3vw, 2rem);
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 25px;
            border-radius: 50px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .zh-label { display: block; font-size: 0.6em; opacity: 0.85; margin-top: 1px; font-weight: normal; }

        .btn {
            background: var(--pastel-blue);
            border: clamp(2px, 0.4vw, 4px) solid white;
            border-radius: 20px;
            padding: 10px 25px;
            font-family: 'Jua', sans-serif;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 5px 0px #76cbd4;
            transition: all 0.1s ease;
            margin: 5px;
            text-align: center;
        }

        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0px #76cbd4; }

        .game-header {
            width: 100%;
            height: 12vh;
            background: rgba(255,255,255,0.95);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            border-bottom: 3px solid var(--pastel-blue);
            z-index: 100;
            padding: 0 10px;
        }

        .header-section { display: flex; align-items: center; gap: 8px; }
        .score-box { font-size: clamp(0.8rem, 2vw, 1.4rem); font-weight: bold; color: var(--text-dark); background: white; padding: 4px 8px; border-radius: 10px; border: 2px solid #eee; }

        .dice-container { display: flex; justify-content: center; align-items: center; width: clamp(50px, 8vh, 70px); }
        .dice-box { width: 100%; aspect-ratio: 1/1; background: white; border-radius: 10px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 8%; box-shadow: inset 0 0 5px rgba(0,0,0,0.1), 0 3px 6px rgba(0,0,0,0.2); cursor: pointer; }
        .dot { background: #222; border-radius: 50%; width: 80%; height: 80%; margin: auto; visibility: hidden; }
        .dot.show { visibility: visible; }

        .game-body { flex: 1; width: 100%; display: flex; background-color: var(--pastel-green); overflow: hidden; }
        .game-area-wrapper { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); gap: 2px; padding: 5px; justify-items: center; align-items: center; }
        
        /* ADJUSTED CHARACTER SIZE FOR TRIO MODE */
        .character { font-size: clamp(1.5rem, 6vh, 3.5rem); transition: transform 0.2s; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .character.whacked { opacity: 0.15; transform: scale(0.5) rotate(15deg); }
        .divider-line { width: 3px; background: white; box-shadow: 0 0 5px rgba(0,0,0,0.1); }

        .result-card { background: white; padding: 30px; border-radius: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 90%; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes roll { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
        .rolling { animation: roll 0.15s infinite linear; }
        .hammer-hit { position: fixed; font-size: 35px; pointer-events: none; z-index: 999999; transform-origin: bottom right; animation: hammerSwing 0.2s ease-out forwards; }
        @keyframes hammerSwing { 0% { transform: translate(-50%, -50%) rotate(0deg); } 50% { transform: translate(-50%, -50%) rotate(-40deg) scale(1.2); } 100% { transform: translate(-50%, -50%) rotate(0deg); opacity: 0; } }
    </style>
</head>
<body onclick="spawnHammer(event)">

    <!-- Main Menu Screen -->
    <div id="menu-screen" class="active">
        <h1 class="main-title">Teacher Mikee’s English Hub</h1>
        <h2 class="sub-title">Whack and Win</h2>
        <div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center;">
            <button class="btn" onclick="openSelection('single')">SINGLE PLAYER <span class="zh-label">單人模式</span></button>
            <button class="btn" onclick="openSelection('dual')" style="background: var(--pastel-purple); box-shadow: 0 5px 0px #8ba7d6;">DUAL PLAYER <span class="zh-label">雙人模式</span></button>
            <button class="btn" onclick="openSelection('trio')" style="background: var(--pastel-pink); box-shadow: 0 5px 0px #cc9ecb;">TRIO PLAYER <span class="zh-label">三人模式</span></button>
        </div>
    </div>

    <!-- Character Selection -->
    <div id="char-screen" class="screen">
        <div style="display: flex; width: 100%; height: 100%;">
            <div id="p1-select" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right: 2px dashed #ddd;">
                <div class="score-box">P1</div>
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin:10px;" id="p1-icons"></div>
                <button class="btn" onclick="ready(1)">OK</button>
            </div>
            <div id="p2-select" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right: 2px dashed #ddd;">
                <div class="score-box">P2</div>
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin:10px;" id="p2-icons"></div>
                <button class="btn" onclick="ready(2)">OK</button>
            </div>
            <div id="p3-select" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <div class="score-box">P3</div>
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin:10px;" id="p3-icons"></div>
                <button class="btn" onclick="ready(3)">OK</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="header-section" style="justify-content: flex-start; flex-wrap: wrap;">
                <div class="score-box" id="p1-label">P1: <span id="count-1">30</span></div>
                <div class="score-box" id="p3-label" style="display:none;">P3: <span id="count-3">30</span></div>
            </div>
            <div class="dice-container">
                <div class="dice-box" id="main-dice" onclick="rollDice()">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>
            <div class="header-section" style="justify-content: flex-end; flex-wrap: wrap;">
                <button class="btn" style="padding: 4px 10px; font-size: 0.7rem; background:var(--pastel-red); box-shadow: 0 3px 0 #d69595;" onclick="finish()">FINISH</button>
                <div class="score-box" id="p2-label">P2: <span id="count-2">30</span></div>
            </div>
        </div>
        <div class="game-body">
            <div id="grid-1" class="game-area-wrapper"></div>
            <div id="divider-1" class="divider-line" style="display:none;"></div>
            <div id="grid-2" class="game-area-wrapper" style="display:none;"></div>
            <div id="divider-2" class="divider-line" style="display:none;"></div>
            <div id="grid-3" class="game-area-wrapper" style="display:none;"></div>
        </div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen">
        <div class="result-card">
            <h1 id="win-title" class="main-title" style="color:var(--text-dark); text-shadow:none;">Winner!</h1>
            <p id="win-score" style="font-size:1.2rem; margin: 15px 0; color: var(--text-dark);"></p>
            <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        let mode = 'single';
        let chars = { 1: '🐻', 2: '🐱', 3: '🐼' };
        let readies = { 1: false, 2: false, 3: false };
        let counts = { 1: 30, 2: 30, 3: 30 };
        const iconList = ['🐻', '🐱', '🐼', '🐘', '🐨', '🦁'];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq, type, dur, vol = 0.2) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + dur);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function spawnHammer(e) {
            const h = document.createElement('div');
            h.className = 'hammer-hit'; h.innerText = '🔨';
            h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 200);
        }

        function openSelection(m) {
            mode = m;
            readies = { 1: false, 2: false, 3: false };
            document.getElementById('p2-select').style.display = (m === 'dual' || m === 'trio') ? 'flex' : 'none';
            document.getElementById('p3-select').style.display = (m === 'trio') ? 'flex' : 'none';
            
            ['p1', 'p2', 'p3'].forEach((p, i) => {
                const container = document.getElementById(`${p}-icons`);
                container.innerHTML = iconList.map(icon => `<div style="font-size:2rem; cursor:pointer;" onclick="pick(${i+1}, '${icon}', this)">${icon}</div>`).join('');
            });

            document.querySelectorAll('#menu-screen, .screen, #win-screen').forEach(s => s.classList.remove('active'));
            document.getElementById('char-screen').classList.add('active');
        }

        function pick(p, c, el) {
            el.parentElement.querySelectorAll('div').forEach(o => o.style.transform = 'scale(1)');
            el.style.transform = 'scale(1.3)';
            chars[p] = c;
            sfx(400, 'sine', 0.1);
        }

        function ready(p) {
            readies[p] = true;
            sfx(600, 'sine', 0.1);
            if(mode === 'single' && readies[1]) start();
            if(mode === 'dual' && readies[1] && readies[2]) start();
            if(mode === 'trio' && readies[1] && readies[2] && readies[3]) start();
        }

        function start() {
            document.querySelectorAll('#menu-screen, .screen, #win-screen').forEach(s => s.classList.remove('active'));
            document.getElementById('game-screen').classList.add('active');
            
            const g2 = document.getElementById('grid-2'), g3 = document.getElementById('grid-3');
            const d1 = document.getElementById('divider-1'), d2 = document.getElementById('divider-2');
            const l2 = document.getElementById('p2-label'), l3 = document.getElementById('p3-label');

            g2.style.display = (mode !== 'single') ? 'grid' : 'none';
            d1.style.display = (mode !== 'single') ? 'block' : 'none';
            l2.style.visibility = (mode !== 'single') ? 'visible' : 'hidden';

            g3.style.display = (mode === 'trio') ? 'grid' : 'none';
            d2.style.display = (mode === 'trio') ? 'block' : 'none';
            l3.style.display = (mode === 'trio') ? 'block' : 'none';

            renderGrid('grid-1', chars[1], 1);
            if(mode !== 'single') renderGrid('grid-2', chars[2], 2);
            if(mode === 'trio') renderGrid('grid-3', chars[3], 3);
        }

        function renderGrid(id, char, p) {
            const g = document.getElementById(id);
            g.innerHTML = ''; counts[p] = 30;
            for(let i=0; i<30; i++) {
                const d = document.createElement('div');
                d.className = 'character'; d.innerText = char;
                d.onclick = () => {
                    d.classList.toggle('whacked');
                    counts[p] += d.classList.contains('whacked') ? -1 : 1;
                    sfx(d.classList.contains('whacked') ? 150 : 600, 'sine', 0.1);
                    document.getElementById(`count-${p}`).innerText = counts[p];
                };
                g.appendChild(d);
            }
            document.getElementById(`count-${p}`).innerText = counts[p];
        }

        function rollDice() {
            const dice = document.getElementById('main-dice');
            if(dice.classList.contains('rolling')) return;
            dice.classList.add('rolling');
            let it = 0;
            let timer = setInterval(() => {
                drawDice(Math.floor(Math.random()*6)+1);
                sfx(200, 'square', 0.05);
                if(it++ > 12) { clearInterval(timer); dice.classList.remove('rolling'); drawDice(Math.floor(Math.random()*6)+1); }
            }, 70);
        }

        function drawDice(val) {
            const dots = document.getElementById('main-dice').querySelectorAll('.dot');
            dots.forEach(d => d.classList.remove('show'));
            const map = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
            map[val].forEach(idx => dots[idx].classList.add('show'));
        }

        function finish() {
            let t = "Winner!", s = "";
            if(mode === 'single') { t = "Well Done!"; s = `Remaining: ${counts[1]}`; }
            else {
                let players = [{n:'P1', c:counts[1]}, {n:'P2', c:counts[2]}];
                if(mode === 'trio') players.push({n:'P3', c:counts[3]});
                players.sort((a,b) => a.c - b.c);
                if(players[0].c === players[1].c) t = "It's a Tie!";
                else t = `${players[0].n} Wins!`;
                s = players.map(p => `${p.n}: ${p.c}`).join(' | ');
            }
            document.getElementById('win-title').innerHTML = t;
            document.getElementById('win-score').innerText = s;
            document.querySelectorAll('#menu-screen, .screen').forEach(s => s.classList.remove('active'));
            document.getElementById('win-screen').classList.add('active');
        }
        drawDice(1);
    </script>
</body>
</html>
